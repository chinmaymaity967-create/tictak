<!DOCTYPE html>

<!-- Simple HTML structure for a Tic Tac Toe game. It includes a heading, a div for the game board, a status display for the current player's turn, and a button to restart the game. The JavaScript file "tictac.js" is linked at the end of the body to handle the game logic.
<body> -->

  <h1>Tic Tac Toe</h1>

  <div class="board" id="board"></div>

  <div id="status">Player X's Turn</div>

  <button onclick="restartGame()">Restart Game</button>

  <script src="tictac.js"></script>
</body>
</html>
